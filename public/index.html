<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMA-ERP-Q Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🚀 TMA-ERP-Q Admin Panel</h1>
            <p>Система управления качеством на производстве</p>
            
            <div id="status">
                <p>Проверяем соединение с API...</p>
            </div>
            
            <div>
                <a href="/api/v1/health" class="btn" target="_blank">Проверить API</a>
                <a href="/telegram-simulator.html" class="btn">Тест Telegram</a>
            </div>
        </div>
    </div>
    
    <script>
        fetch('/api/v1/health')
            .then(r => r.json())
            .then(data => {
                document.getElementById('status').innerHTML = `
                    <h3 style="color: green;">✅ API работает!</h3>
                    <p>Статус: ${data.status}</p>
                    <p>Время: ${new Date(data.timestamp).toLocaleString()}</p>
                `;
            })
            .catch(err => {
                document.getElementById('status').innerHTML = 
                    '<h3 style="color: red;">❌ Ошибка подключения к API</h3>';
            });
    </script>
</body>
</html>
