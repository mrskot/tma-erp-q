<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TMA-ERP-Q</title>
    <link rel="stylesheet" href="/css/telegram.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- === Экраны состояния === -->
    <div id="loading-screen" class="app-screen"><div class="spinner"></div><p>Загрузка...</p></div>

    <div id="login-screen" class="app-screen hidden">
        <div class="login-container">
            <h2>Вход в TMA-ERP-Q</h2>
            <p>Введите ваш PIN-код</p>
            <form id="login-form">
                <input type="password" id="pin-input" pattern="\d{4}" maxlength="4" inputmode="numeric" placeholder="••••" required>
                <button type="submit" class="button">Войти</button>
            </form>
            <p id="login-error" class="error-message hidden"></p>
        </div>
    </div>

    <!-- === Основное приложение === -->
    <div id="main-app" class="app-screen hidden">
        <header>
            <div class="container header-container">
                <div id="user-info"></div>
                <button id="logout-button" class="button button-secondary">Выйти</button>
            </div>
        </header>
        <nav></nav>
        <main id="page-content" class="container"></main>
    </div>

    <!-- === Модальные окна === -->
    <div id="modals-container">
        <!-- Модалка Пользователей -->
        <div id="user-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Пользователь</h2>
                <form id="user-form">
                    <input type="hidden" name="id">
                    <div class="form-group"><label>Имя:</label><input type="text" name="first_name" required></div>
                    <div class="form-group"><label>Фамилия:</label><input type="text" name="last_name"></div>
                    <div class="form-group"><label>Роль:</label><select name="role" required><option value="worker">Рабочий</option><option value="master">Мастер</option><option value="inspector">Контролёр ОТК</option><option value="director">Директор</option><option value="admin">Администратор</option></select></div>
                    <div class="form-group"><label>Telegram ID:</label><input type="text" name="telegram_id" required></div>
                    <div class="form-group"><label>Bitrix ID:</label><input type="text" name="bitrix_id"></div>
                    <div class="form-group" id="user-pin-code-group"><label>PIN (4 цифры):</label><input type="text" name="pin_code" maxlength="4" placeholder="Пусто для автогенерации"></div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модалка Участков -->
        <div id="lot-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Участок</h2>
                <form id="lot-form">
                    <input type="hidden" name="id">
                    <div class="form-group"><label>Название:</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>Код:</label><input type="text" name="code" required></div>
                    <div class="form-group"><label>Основной мастер:</label><select name="main_master_id"></select></div>
                    <div class="form-group"><label>Временный мастер:</label><select name="temp_master_id"></select></div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модалка Изделий -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Изделие</h2>
                <form id="product-form">
                     <input type="hidden" name="id">
                     <div class="form-group"><label>Название:</label><input type="text" name="name" required></div>
                     <div class="form-group"><label>Тип:</label><select name="product_type"><option value="finished">Готовое</option><option value="semi_finished">Полуфабрикат</option></select></div>
                     <div class="form-group"><label>Участок:</label><select name="lot_id" required></select></div>
                     <div class="form-group"><label>Чек-лист (каждый пункт с новой строки):</label><textarea name="checklist" rows="4"></textarea></div>
                     <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Остальные модалки (Applications, Discrepancies) можно добавить сюда по аналогии -->
    </div>
    
    <script src="/js/app.js" type="module"></script>
</body>
</html>
