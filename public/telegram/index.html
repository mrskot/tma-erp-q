<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TMA-ERP-Q</title>
    <link rel="stylesheet" href="/css/telegram.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- === Экраны состояния === -->
    <div id="loading-screen" class="app-screen"><div class="spinner"></div><p>Загрузка...</p></div>

    <div id="login-screen" class="app-screen hidden">
        <div class="login-container">
            <h2>Вход в TMA-ERP-Q</h2>
            <p>Введите ваш PIN-код</p>
            <form id="login-form">
                <input type="password" id="pin-input" pattern="\d{4}" maxlength="4" inputmode="numeric" placeholder="••••" required>
                <button type="submit" class="button">Войти</button>
            </form>
            <p id="login-error" class="error-message hidden"></p>
        </div>
    </div>

    <!-- === Основное приложение === -->
    <div id="main-app" class="app-screen hidden">
        <header>
            <div class="container header-container">
                <div id="user-info"></div>
                <button id="logout-button" class="button button-secondary">Выйти</button>
            </div>
        </header>
        <nav></nav>
        <main id="page-content" class="container"></main>
    </div>

    <!-- === Модальные окна === -->
    <div id="modals-container">
        <!-- Модалка Пользователей -->
        <div id="user-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Пользователь</h2>
                <form id="user-form">
                    <input type="hidden" name="id">
                    <div class="form-group"><label>Имя:</label><input type="text" name="first_name" required></div>
                    <div class="form-group"><label>Фамилия:</label><input type="text" name="last_name"></div>
                    <div class="form-group"><label>Роль:</label><select name="role" required><option value="worker">Рабочий</option><option value="master">Мастер</option><option value="inspector">Контролёр ОТК</option><option value="director">Директор</option><option value="admin">Администратор</option></select></div>
                    <div class="form-group"><label>Telegram ID:</label><input type="text" name="telegram_id" required></div>
                    <div class="form-group"><label>Bitrix ID:</label><input type="text" name="bitrix_id"></div>
                    <div class="form-group" id="user-pin-code-group"><label>PIN (4 цифры):</label><input type="text" name="pin_code" maxlength="4" placeholder="Пусто для автогенерации"></div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модалка Участков -->
        <div id="lot-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Участок</h2>
                <form id="lot-form">
                    <input type="hidden" name="id">
                    <div class="form-group"><label>Название:</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>Код:</label><input type="text" name="code" required></div>
                    <div class="form-group"><label>Основной мастер:</label><select name="main_master_id"></select></div>
                    <div class="form-group"><label>Временный мастер:</label><select name="temp_master_id"></select></div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модалка Изделий -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span><h2 class="modal-title">Изделие</h2>
                <form id="product-form">
                     <input type="hidden" name="id">
                     <div class="form-group"><label>Название:</label><input type="text" name="name" required></div>
                     <div class="form-group"><label>Тип:</label><select name="product_type"><option value="finished">Готовое</option><option value="semi_finished">Полуфабрикат</option><option value="assembly">Узел</option><option value="part">Деталь</option></select></div>
                     <div class="form-group"><label>Участок:</label><select name="lot_id" required></select></div>
                     <div class="form-group"><label>Контролёр по умолчанию:</label><select name="default_inspector_id"></select></div>
                     <div class="form-group"><label>Режим контроля:</label><select name="inspection_mode"><option value="lite">🚀 LITE (Доверительный)</option><option value="hard">🛡️ HARD (Строгий)</option></select></div>
                     <div class="form-group"><label>Чек-лист (каждый пункт с новой строки):</label><textarea name="checklist" rows="4"></textarea></div>
                     <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модалка Заявок (Application) -->
        <div id="application-modal" class="modal">
            <div class="modal-content large">
                <span class="close">&times;</span>
                <h2 class="modal-title">Создать партию заявок</h2>
                <form id="application-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>№ Произв. заказа:</label>
                            <input type="text" id="app-production-order" name="production_order_number" required>
                        </div>
                        <div class="form-group">
                            <label>Изделие:</label>
                            <select id="app-product-id" name="product_id" required></select>
                        </div>
                        <div class="form-group">
                            <label>Участок:</label>
                            <select id="app-lot-id" name="lot_id" required disabled></select>
                        </div>
                        <div class="form-group">
                            <label>Мастер:</label>
                            <select id="app-master-id" name="master_id" required disabled></select>
                        </div>
                        <div class="form-group">
                            <label>Номер чертежа:</label>
                            <input type="text" id="app-drawing-number" name="drawing_number">
                        </div>
                        <div class="form-group">
                            <label>Количество (шт):</label>
                            <input type="number" id="app-quantity" name="quantity" min="1" value="1" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><input type="checkbox" id="app-has-serials" name="has_serial_numbers" checked> Указать серийные номера</label>
                    </div>
                    
                    <div id="app-serials-container" class="serials-grid"></div>
                    
                    <div class="form-group">
                        <label>Желаемый срок приёмки:</label>
                        <input type="datetime-local" id="app-desired-time" name="desired_inspection_time" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Заметки:</label>
                        <textarea id="app-notes" name="notes" rows="2"></textarea>
                    </div>
                    
                    <!-- Скрытое поле для фото (пока так) -->
                    <input type="hidden" id="app-mki-photo" name="mki_photo_url">
                    
                    <button type="submit" class="button">Создать заявки</button>
                </form>
            </div>
        </div>

        <!-- Модалка Деталей Заявки (Application Details) -->
        <div id="application-details-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="modal-title">Детали заявки</h2>
                <div id="app-details-content">
                    <div class="details-section">
                        <!-- Сюда JS вставит данные: номер, статус и т.д. -->
                        <div style="margin-bottom: 10px;"><strong>Номер:</strong> <span id="view-app-number"></span></div>
                        <div style="margin-bottom: 5px;">Заказ: <span id="view-app-order"></span></div>
                        <div style="margin-bottom: 5px;">Изделие: <span id="view-app-product"></span></div>
                        <div style="margin-bottom: 5px;">Чертеж: <span id="view-app-drawing"></span></div>
                        <div style="margin-bottom: 5px;">Сер. номер: <span id="view-app-serial"></span></div>
                        <div style="margin-bottom: 5px;">Мастер: <span id="view-app-master"></span></div>
                        <div style="margin-bottom: 5px;">Участок: <span id="view-app-lot"></span></div>
                        <div style="margin-bottom: 5px;">Статус: <span id="view-app-status"></span></div>
                    </div>
                    
                    <!-- Секция чек-листа -->
                    <div id="view-app-checklist-section" style="margin-top: 15px; display: none;">
                        <h4>Чек-лист:</h4>
                        <div id="view-app-checklist-items"></div>
                    </div>

                    <!-- Секция МКИ -->
                    <div id="view-app-mki-section" style="margin-top: 15px; display: none;">
                        <h4>Фото МКИ:</h4>
                        <img id="view-app-mki-img" src="" style="max-width: 100%;">
                    </div>

                    <!-- Секция несоответствий -->
                    <div style="margin-top: 15px;">
                        <h4>Несоответствия:</h4>
                        <div id="view-app-discrepancies-list"></div>
                    </div>

                    <!-- Кнопки действий -->
                    <div id="view-app-actions" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;"></div>
                </div>
            </div>
        </div>

        <!-- Модалка Несоответствий (Discrepancy) -->
        <div id="discrepancy-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="modal-title">Несоответствие</h2>
                <form id="discrepancy-form">
                    <input type="hidden" name="id">
                    <input type="hidden" name="application_id">
                    
                    <div id="disc-app-info" style="margin-bottom: 10px; font-weight: bold;">
                        Заявка: <span id="disc-app-number-val"></span>
                    </div>

                    <div class="form-group">
                        <label>Краткое описание:</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Подробное описание:</label>
                        <textarea name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Серьезность:</label>
                        <select name="severity">
                            <option value="low">Низкая</option>
                            <option value="medium" selected>Средняя</option>
                            <option value="high">Высокая</option>
                            <option value="critical">Критическая</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Фото дефекта (URL):</label>
                        <input type="text" id="disc-photo" name="defect_photo_url">
                    </div>

                    <div class="form-group">
                        <label>Ответственный:</label>
                        <select id="disc-responsible" name="responsible_id"></select>
                    </div>
                    
                    <div class="form-group">
                        <label>Срок устранения:</label>
                        <input type="datetime-local" id="disc-due-date" name="due_date">
                    </div>

                    <!-- Поля статуса (видны только контролеру) -->
                    <div class="form-group">
                        <label>Статус:</label>
                        <select id="disc-status" name="status">
                            <option value="new">Новое</option>
                            <option value="assigned">Назначено</option>
                            <option value="in_progress">В работе</option>
                            <option value="resolved">Устранено</option>
                            <option value="closed">Закрыто</option>
                        </select>
                    </div>

                    <!-- Сценарий закрытия -->
                    <div id="closure-scenario-group" class="form-group" style="display:none;">
                        <label>Сценарий закрытия:</label>
                        <select id="disc-scenario" name="closure_scenario">
                            <option value="fixed">Устранено</option>
                            <option value="resolution_card">Карточка разрешения</option>
                            <option value="political">Полит. решение</option>
                            <option value="scrap">Брак</option>
                        </select>
                    </div>
                    
                    <div id="scenario-details-group" class="form-group" style="display:none;">
                        <label>Детали решения:</label>
                        <textarea name="resolution_card_details" rows="3"></textarea>
                    </div>

                    <!-- Поля мастера -->
                    <div id="master-action-fields" style="display:none; border-top: 1px solid #ccc; padding-top: 10px;">
                        <div class="form-group">
                            <label>Фото устранения:</label>
                            <input type="text" name="fix_photo_url">
                        </div>
                        <div class="form-group" id="special-opinion-group">
                            <label>Особое мнение:</label>
                            <textarea id="disc-special-opinion" name="special_opinion"></textarea>
                        </div>
                    </div>

                    <div id="discrepancy-actions" style="margin-top: 15px;"></div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/js/app.js" type="module"></script>
</body>
</html>
