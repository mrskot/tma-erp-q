<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TMA-ERP-Q</title>
    <link rel="stylesheet" href="/css/telegram.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <!-- Подключение Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Основной скрипт для работы с Telegram -->
    <script src="/js/telegram-app.js"></script>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen" class="app-screen">
        <div class="spinner"></div>
        <p>Загрузка приложения...</p>
        <p id="init-data-status"></p>
    </div>

    <!-- Экран входа по PIN-коду -->
    <div id="login-screen" class="app-screen hidden">
        <div class="login-container">
            <h2>Вход в TMA-ERP-Q</h2>
            <p>Введите ваш PIN-код для доступа</p>
            <form id="login-form">
                <input type="password" id="pin-input" pattern="\d{4}" maxlength="4" inputmode="numeric" placeholder="••••" required autocomplete="new-password">
                <button type="submit" class="button">Войти</button>
            </form>
            <p id="login-error" class="error-message hidden"></p>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="main-app" class="app-screen hidden">
        <header>
            <div class="container">
                <div id="user-info">Загрузка...</div>
                <button id="logout-button" class="button button-secondary">Выйти</button>
            </div>
        </header>
        <nav>
            <!-- Навигация будет сгенерирована в app.js -->
        </nav>
        <main id="page-content" class="container">
            <!-- Контент страницы будет рендериться здесь -->
        </main>
    </div>

    <!-- === Модальные окна === -->
    <div id="modals-container">
        <!-- Модальное окно для Пользователей -->
        <div id="user-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="modal-title">Создать пользователя</h2>
                <form id="user-form">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label for="user-first-name">Имя:</label>
                        <input type="text" id="user-first-name" name="first_name">
                    </div>
                    <div class="form-group">
                        <label for="user-last-name">Фамилия:</label>
                        <input type="text" id="user-last-name" name="last_name">
                    </div>
                    <div class="form-group">
                        <label for="user-telegram-id">Telegram ID:</label>
                        <input type="number" id="user-telegram-id" name="telegram_id">
                    </div>
                    <div class="form-group">
                        <label for="user-bitrix-id">Bitrix ID:</label>
                        <input type="number" id="user-bitrix-id" name="bitrix_id">
                    </div>
                    <div class="form-group">
                        <label for="user-role">Роль:</label>
                        <select id="user-role" name="role" required>
                            <option value="admin">Администратор</option>
                            <option value="director">Директор</option>
                            <option value="inspector">Контролер ОТК</option>
                            <option value="master">Мастер</option>
                            <option value="worker">Рабочий</option>
                        </select>
                    </div>
                    <div class="form-group" id="user-password-group">
                        <label for="user-pin-code">Пароль (PIN):</label>
                        <input type="text" id="user-pin-code" name="pin_code" placeholder="Оставьте пустым для автогенерации">
                    </div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно для Участков -->
        <div id="lot-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="modal-title">Создать участок</h2>
                <form id="lot-form">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label for="lot-name">Название:</label>
                        <input type="text" id="lot-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="lot-code">Код участка:</label>
                        <input type="text" id="lot-code" name="code" required>
                    </div>
                    <div class="form-group">
                        <label for="lot-main-master-id">Основной мастер:</label>
                        <select id="lot-main-master-id" name="main_master_id">
                            <!-- Опции мастеров будут загружены динамически -->
                        </select>
                    </div>
                     <div class="form-group">
                        <label for="lot-distance">Расстояние до офиса (м):</label>
                        <input type="number" id="lot-distance" name="distance_to_office">
                    </div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно для Изделий -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="modal-title">Создать изделие</h2>
                <form id="product-form">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label for="product-name">Название:</label>
                        <input type="text" id="product-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="product-type">Тип:</label>
                        <select id="product-type" name="type" required>
                            <option value="finished">Готовое изделие</option>
                            <option value="semi_finished">Полуфабрикат</option>
                            <option value="assembly">Сборочная единица</option>
                            <option value="part">Деталь</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-lot-id">Участок:</label>
                        <select id="product-lot-id" name="lot_id">
                            <!-- Опции участков будут загружены динамически -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-previous-lot-id">Предыдущий участок:</label>
                        <select id="product-previous-lot-id" name="previous_lot_id">
                            <!-- Опции участков будут загружены динамически -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-next-lot-id">Следующий участок:</label>
                        <select id="product-next-lot-id" name="next_lot_id">
                            <!-- Опции участков будут загружены динамически -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-default-inspector-id">Контролёр по умолчанию:</label>
                        <select id="product-default-inspector-id" name="default_inspector_id">
                            <!-- Опции контролёров будут загружены динамически -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-inspection-time">Время на приёмку (мин):</label>
                        <input type="number" id="product-inspection-time" name="inspection_time_minutes" min="1" placeholder="30">
                    </div>
                     <div class="form-group">
                        <label>Чек-лист:</label>
                        <div id="product-checklist-container" class="checklist-container">
                            <!-- Элементы чек-листа будут добавлены сюда -->
                        </div>
                        <button type="button" id="add-checklist-item-btn" class="button button-secondary">Добавить пункт</button>
                    </div>
                    <button type="submit" class="button">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
    <!-- === Конец модальных окон === -->

    <!-- === Скрипты === -->
    <!-- API клиент -->
    <script src="/js/api.js"></script>
    <!-- Компоненты -->
    <script src="/js/components/UserModal.js"></script>
    <script src="/js/components/LotModal.js"></script>
    <script src="/js/components/ProductModal.js"></script>
    <!-- Основная логика -->
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <!-- === Конец скриптов === -->
</body>
</html>
